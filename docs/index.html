    <script>
      (function() {
        var noisePatterns = [
          'sender-wallet',
          'sender_getProviderState',
          'sender_',
          'sender-wallet-provider',
          'Failed to get initial state',
          'No account exist',
          'Sender: Failed to get initial state',
          'Sender:',
          'chrome-extension://',
          'moz-extension://',
          'safari-extension://'
        ];

        function isNoiseString(str) {
          if (!str || typeof str !== 'string') return false;
          for (var i = 0; i < noisePatterns.length; i++) {
            if (str.indexOf(noisePatterns[i]) !== -1) return true;
          }
          return false;
        }

        function checkNoise(args) {
          if (!args) return false;
          var combined = '';
          for (var i = 0; i < args.length; i++) {
            var item = args[i];
            if (!item) continue;
            var str = '';
            try {
              if (typeof item === 'string') {
                str = item;
              } else if (item instanceof Error) {
                str = (item.message || '') + ' ' + (item.stack || '');
              } else if (typeof item === 'object') {
                str = JSON.stringify(item);
              } else {
                str = String(item);
              }
            } catch (e) {
              try { str = String(item); } catch (_) {}
            }
            if (isNoiseString(str)) return true;
            combined += ' ' + str;
          }
          return isNoiseString(combined);
        }

        // Intercept window message events (capture phase) to stop extension errors before they fire
        window.addEventListener('message', function(e) {
          try {
            var d = e.data;
            if (!d) return;
            var s = typeof d === 'string' ? d : JSON.stringify(d);
            if (isNoiseString(s)) {
              e.stopImmediatePropagation();
              if (typeof e.stopPropagation === 'function') e.stopPropagation();
              if (typeof e.preventDefault === 'function') e.preventDefault();
            }
          } catch (_) {}
        }, true);

        // Filter all console output methods
        ['error', 'warn', 'info', 'log', 'debug'].forEach(function(method) {
          var orig = console[method];
          if (!orig) return;
          console[method] = function() {
            if (checkNoise(arguments)) return;
            return orig.apply(console, arguments);
          };
        });

        // Prevent error propagation from extension scripts
        window.addEventListener('error', function(e) {
          if (checkNoise([e.message, e.filename, e.error])) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (checkNoise([e.reason])) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
